services:
  postgres:
    image: postgres:16
    container_name: social-postgres
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: ${APP_DB_USER:-social}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-social}
    ports:
      - "5432:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-social} -d social"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: social-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Non-secret service wiring (postgres host is the compose service name)
      APP_JDBC_URL: jdbc:postgresql://postgres:5432/social
      APP_FLYWAY_URL: jdbc:postgresql://postgres:5432/social
      # Infisical service token (secrets are injected by Infisical at runtime)
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com/api}
      INFISICAL_SECRET_ENV: ${INFISICAL_SECRET_ENV:-dev}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: social-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  social_postgres_data: