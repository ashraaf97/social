spring.application.name=social
spring.datasource.url=${APP_JDBC_URL}
spring.datasource.username=${APP_DB_USER}
spring.datasource.password=${APP_DB_PASSWORD}
spring.flyway.url=${APP_FLYWAY_URL}
spring.flyway.user=${APP_DB_USER}
spring.flyway.password=${APP_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

app.tts.provider=${APP_TTS_PROVIDER:elevenlabs}

app.elevenlabs.api-key=${APP_ELEVENLABS_API_KEY}
app.elevenlabs.voice-id=${APP_ELEVENLABS_VOICE_ID}
app.elevenlabs.model-id=${APP_ELEVENLABS_MODEL_ID}
app.elevenlabs.base-url=${APP_ELEVENLABS_BASE_URL}

app.openai.api-key=${APP_OPENAI_API_KEY:}
app.openai.voice=${APP_OPENAI_VOICE:alloy}
app.openai.model=${APP_OPENAI_MODEL:tts-1}
app.openai.base-url=${APP_OPENAI_BASE_URL:https://api.openai.com}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
